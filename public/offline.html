<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07182c" />
    <title>AtacadoApple · Sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #14253b;
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #dce3eb;
        border-radius: 22px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 18px 45px #07182c14;
      }
      .icon {
        width: 58px;
        height: 58px;
        margin: auto;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #e9f0f8;
        color: #07182c;
        font-size: 28px;
      }
      h1 {
        font-size: 23px;
        margin: 18px 0 8px;
      }
      p {
        line-height: 1.6;
        color: #5c6878;
      }
      button {
        border: 0;
        border-radius: 13px;
        background: #07182c;
        color: #fff;
        font-weight: 700;
        padding: 13px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">↻</div>
      <h1>Sem conexão com a internet</h1>
      <p>
        Para proteger estoque, vendas e comprovantes, o sistema precisa estar
        online. Assim que a conexão voltar, tente novamente.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
