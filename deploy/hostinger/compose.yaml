services:
  app:
    image: ${PDV_IMAGE:?Set PDV_IMAGE to a tested release}
    container_name: atacadoapple-app
    restart: unless-stopped
    env_file: .env.runtime
    environment:
      PDV_DATA_DIR: /data
      VINEXT_TRUST_PROXY: '1'
      VINEXT_TRUSTED_HOSTS: atacadoapple.nucleodeoperacao.com.br
    volumes:
      - ./data:/data
    ports:
      - 127.0.0.1:3108:3000
    networks:
      - edge
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  edge:
    external: true
